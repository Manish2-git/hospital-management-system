{% extends "core/base.html" %}

{% block content %}
<h1>Patient List</lh1>
    <table>
        <tr>
            <th>Name</th>
            <th>Age</th>
            <th>Severity</th>
        </tr>
        {% for patient in patients %}   
        <tr>
            <td>{{ patient.name }}</td>
            <td>{{ patient.age }}</td>
            <td>{{ patient.severity }} </td>
            <td>
                <a href="/patients/{{ patient.id }}/edit/">Edit</a>
                <a href="/patients/{{ patient.id }}/delete/">Delete</a>
            </td>
        </tr>
        {% endfor %}
    </table>
    
            {% endblock %}
