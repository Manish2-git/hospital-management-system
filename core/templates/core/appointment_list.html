{% extends "core/base.html" %}

{% block content %}
<h1>Appointment List</h1>
<table>
    <tr> 
        <th>Patient</th>
        <th>Doctor</th>
        <th>Date</th>
        <th>Time</th>
    </tr>
    {% for appointment in appointments %}
    <tr>
        <td>{{ appointment.patient.name }}</td>
         <td>{{ appointment.doctor.name }}</td>
         <td>{{ appointment.date }}</td>
         <td>{{ appointment.time }}</td>
    </tr>
    {% endfor %}
</table>      
{% endblock %}
