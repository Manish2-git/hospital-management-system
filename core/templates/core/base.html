<!DOCTYPE html>
<html>
<head>
    <title>Hospital Management System</title>
        <style>
            body {
                font-family: 'segeo UI', Arial, sans-serif;
                background-color: #EAF4F4;
                margin: 0;
                padding: 0;

            }   
            nav {
                background: linear-gradient(90deg, #1a5276, #2c7a7b);
                padding: 18px 25px;
                box-shadow: 0 2px 8px rgba(0,0,0,0.15);
            } 
            nav a{
                color: white;
                margin-right: 20px;
                text-decoration: none;
                font-weight: bold;
            }
            .container {
                padding: 20px;
            }
            h1 {
                color: #2c7a7b;
            }
            ul {
                list-style: none;
                padding: 0;
            }
            li {
                transition: transform 0.2s;
            }
            li:hover{
                transform: translateX(5px);
                box-shadow: 0 3px 8px rgba(0,0,0,0.15);
            }
        </style>
    </head>
</body>
<nav>
    <img src="https://cdn-icons-png.flaticon.com/512/2966/2966327.png" alt="hospital icon" style="height: 30px; vertical-align: middle;">
    <a href="/">Home</a>
    <a href="/patients">Patients</a>
    <a href="/appointments">Appointments</a>
    <a href="/emergency-queue/"> 🚨Emergency Queue</a>
</nav>
<div class="container">
    {% block content %}
    {% endblock %}
</div>
</body>
</html>
